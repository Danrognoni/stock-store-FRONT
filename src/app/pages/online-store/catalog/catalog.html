<div class="catalog-grid">
  @for (product of products(); track product.id) {
    <mat-card class="product-card">
      
      <img mat-card-image [src]="product.imageUrl" [alt]="product.name" class="product-image">

      <mat-card-header>
        <mat-card-title>{{ product.name }}</mat-card-title>
        <mat-card-subtitle>$ {{ product.price }}</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <div class="category-container">
          @for(cat of product.categories; track cat.id) { 
            <span class="category-pill">{{cat.name}}</span> 
          }
        </div>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button [routerLink]="['/online-store/product', product.id]">Ver Detalle</button>
        
        <button mat-flat-button 
                color="primary" 
                (click)="addToCart(product)"
                [disabled]="isInCart(product.id)">
            
            @if (isInCart(product.id)) {
                <mat-icon>check</mat-icon> En carrito
            } @else {
                <mat-icon>shopping_cart</mat-icon> Agregar
            }
        </button>
      </mat-card-actions>

      <button class="like-button" 
              [class.liked-active]="isInWishlist(product.id)"
              (click)="addToWishlist(product)"
              [disabled]="isInWishlist(product.id)">
        
        <mat-icon>thumb_up</mat-icon> 
        
        {{ isInWishlist(product.id) ? 'Te gusta' : 'Like' }}
      </button>

    </mat-card>
  }
</div>
