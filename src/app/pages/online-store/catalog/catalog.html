<div class="catalog-grid" style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;">
  @for (product of products(); track product.id) {
    <mat-card style="width: 300px;">
      <img mat-card-image [src]="product.imageUrl" [alt]="product.name" style="height: 200px; object-fit: cover;">
      
      <mat-card-header>
        <mat-card-title>{{ product.name }}</mat-card-title>
        <mat-card-subtitle>$ {{ product.price }}</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <p>Categorías: 
            @for(cat of product.categories; track cat.id) { 
                <span>{{cat.name}} </span> 
            }
        </p>
      </mat-card-content>

      <mat-card-actions >
        <button mat-button [routerLink]="['/store/product', product.id]">Ver Detalle</button>
        <button mat-flat-button color="primary" (click)="addToCart(product)">
          <mat-icon>shopping_cart</mat-icon> Agregar
        </button>
      </mat-card-actions>
    </mat-card>
  }
</div>
