<div class="container">
  <h2>Recuperar Contraseña</h2>

  <div *ngIf="step() === 0">
    <form [formGroup]="emailForm" (ngSubmit)="sendEmail()">
      <div class="mb-3">
        <label>Email</label>
        <input type="email" formControlName="email" class="form-control" placeholder="tu@email.com">
      </div>
      <button type="submit" [disabled]="emailForm.invalid">Enviar Código</button>
    </form>
  </div>

  <div *ngIf="step() === 1">
    <p>Se envió un código a {{ emailSent() }}</p>
    <form [formGroup]="codeForm" (ngSubmit)="verifyCode()">
      <div class="mb-3">
        <label>Código de Verificación</label>
        <input type="text" formControlName="code" class="form-control">
      </div>
      <button type="submit" [disabled]="codeForm.invalid">Verificar</button>
    </form>
  </div>

  <div *ngIf="step() === 2">
    <form [formGroup]="passwordForm" (ngSubmit)="changePassword()">
      <div class="mb-3">
        <label>Nueva Contraseña</label>
        <input type="password" formControlName="password" class="form-control">
      </div>
      <div class="mb-3">
        <label>Confirmar Contraseña</label>
        <input type="password" formControlName="confirmPassword" class="form-control">
      </div>
      <button type="submit" [disabled]="passwordForm.invalid">Cambiar Contraseña</button>
    </form>
  </div>
</div>
