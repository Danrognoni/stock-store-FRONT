<div class="flex min-h-screen items-start justify-center bg-gray-50 p-4 sm:pt-10">
  <mat-card class="w-full max-w-2xl !rounded-xl bg-white !p-2 !shadow-lg sm:!p-6">
    <mat-card-header class="!mb-6 block border-b border-gray-100 !pb-4">
      <mat-card-title class="!text-2xl !font-bold text-gray-900">Mi Perfil</mat-card-title>
      <mat-card-subtitle class="mt-1 text-sm text-gray-500">Administra tu información personal</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="profileForm" (ngSubmit)="onSave()" class="flex flex-col gap-4">

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="name" placeholder="Tu nombre">
            <mat-error>El nombre es requerido</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Apellido</mat-label>
            <input matInput formControlName="lastname" placeholder="Tu apellido">
            <mat-error>El apellido es requerido</mat-error>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Teléfono</mat-label>
          <input matInput formControlName="phoneNumber" placeholder="Tu número de celular">
          <mat-error>El teléfono es requerido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email">
          <mat-hint class="text-gray-400">El email no se puede cambiar directamente</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Rol</mat-label>
          <input matInput formControlName="role">
        </mat-form-field>

        <div class="mt-4 flex justify-end sm:mt-8">
          <button mat-raised-button color="primary" type="submit" [disabled]="profileForm.invalid || profileForm.pristine" class="!h-12 w-full !rounded-lg !text-base !font-medium sm:w-auto sm:!px-8">
            Guardar Cambios
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
