<div class="flex min-h-screen items-center justify-center bg-gray-50 p-4 sm:p-6">
  <mat-card class="w-full max-w-lg !rounded-xl bg-white !p-2 !shadow-lg sm:!p-6">
    
    <mat-card-header class="!mb-6 block border-b border-gray-100 !pb-4">
      <mat-card-title class="!text-2xl !font-bold text-gray-900">Editar Usuario</mat-card-title>
      <mat-card-subtitle class="mt-1 text-sm text-gray-500">Modificar información</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="name" placeholder="Ej. Juan">
            <mat-error>El nombre es requerido</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Apellido</mat-label>
            <input matInput formControlName="lastname" placeholder="Ej. Pérez">
            <mat-error>El apellido es requerido</mat-error>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Teléfono</mat-label>
          <input matInput formControlName="phoneNumber" placeholder="Ej. 1122334455">
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email">
          <mat-hint class="text-gray-400">El email no se puede modificar</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Rol</mat-label>
          <mat-select formControlName="role">
            <mat-option value="USER">Usuario (Cliente)</mat-option>
            <mat-option value="EMPLOYEE">Empleado</mat-option>
            <mat-option value="ADMIN">Administrador</mat-option>
          </mat-select>
          <mat-error>El rol es requerido</mat-error>
        </mat-form-field>

        <div class="mt-6 flex flex-col-reverse justify-end gap-3 sm:flex-row">
          <button mat-button type="button" routerLink="/admin" class="!h-12 w-full !rounded-lg !text-base sm:w-auto sm:!px-6">
            Cancelar
          </button>
          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || loading" class="!h-12 w-full !rounded-lg !text-base !font-medium sm:w-auto sm:!px-8">
            <mat-icon class="mr-2">save</mat-icon> Guardar Cambios
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
