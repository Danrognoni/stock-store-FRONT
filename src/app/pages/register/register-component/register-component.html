<div class="register-wrapper" style="display: flex; justify-content: center; padding-top: 50px;">
  <mat-card style="max-width: 500px; width: 100%; padding: 20px;">
    <mat-card-header>
      <mat-card-title>Crear Cuenta</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
        
        <div style="display: flex; gap: 10px;">
          <mat-form-field appearance="outline" style="flex: 1;">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="name">
            <mat-error *ngIf="registerForm.get('name')?.hasError('required')">Requerido</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" style="flex: 1;">
            <mat-label>Apellido</mat-label>
            <input matInput formControlName="lastname">
            <mat-error *ngIf="registerForm.get('lastname')?.hasError('required')">Requerido</mat-error>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline">
          <mat-label>Teléfono</mat-label>
          <input matInput formControlName="phoneNumber">
          <mat-error *ngIf="registerForm.get('phoneNumber')?.hasError('required')">Requerido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email">
          <mat-error *ngIf="registerForm.get('email')?.hasError('email')">Email inválido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password">
          <mat-hint>Mínimo 6 caracteres</mat-hint>
          <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">Mínimo 6 caracteres</mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="registerForm.invalid">
          Registrarse
        </button>
      </form>
    </mat-card-content>
    
    <mat-card-footer style="text-align: center; margin-top: 20px; padding-bottom: 10px;">
      <p>¿Ya tienes cuenta? <a routerLink="/auth/login" style="text-decoration: none; color: #3f51b5;">Ingresa aquí</a></p>
    </mat-card-footer>
  </mat-card>
</div>
