<div class="main-container">
  <div class="toolbar-section">
    <div class="search-bar">
      <input 
        type="text" 
        #txtSearch 
        class="modern-input" 
        placeholder="Buscar productos..." 
        (input)="onSearch(txtSearch.value)">
    </div>
  </div>

  <div class="grid-layout">
    @for (product of products(); track product.id) {
      <mat-card class="modern-card">
        <div class="card-image-wrapper">
          <img [src]="product.imageUrl || 'assets/placeholder.png'" [alt]="product.name">
        </div>
        
        <div class="card-body">
          <h3 class="card-title">{{ product.name }}</h3>
        </div>

        <mat-divider></mat-divider>
        
        <mat-card-actions class="card-actions">
          <a mat-button class="action-btn view-btn" [routerLink]='["/products/detail", product.id]'>Ver</a>
          <a mat-button class="action-btn edit-btn" [routerLink]='["/products/edit", product.id]'>Editar</a>
          <button mat-button color="warn" class="action-btn delete-btn" (click)="deleteProduct(product.id)">Eliminar</button>
        </mat-card-actions>
      </mat-card>
    }
  </div>

  <div class="paginator-wrapper">
    <mat-paginator
      [length]="totalElements()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 18, 25]"
      [pageIndex]="pageIndex()"
      (page)="changePage($event)"
      aria-label="Seleccionar página">
    </mat-paginator>
  </div>
</div>
