<div class="flex min-h-[calc(100vh-80px)] flex-col bg-gray-50 p-4">
  <div class="mb-6 flex w-full justify-center sm:justify-start">
    <div class="relative w-full max-w-sm">
      <input 
        type="text" 
        #txtSearch 
        class="w-full rounded-lg border-gray-200 bg-white px-3 py-2 pl-9 text-sm shadow-sm transition-all placeholder:text-gray-400 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-200" 
        placeholder="Buscar..." 
        (input)="onSearch(txtSearch.value)">
      <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>
      </span>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">
    @for (product of products(); track product.id) {
      <mat-card class="flex flex-col overflow-hidden !rounded-lg bg-white !shadow-sm transition-all duration-300 hover:!shadow-md hover:-translate-y-0.5">
        <div class="relative aspect-[4/3] w-full overflow-hidden bg-gray-100">
          <img [src]="product.imageUrl || 'assets/placeholder.png'" [alt]="product.name" class="h-full w-full object-cover object-center transition-transform duration-500 hover:scale-105">
        </div>
        
        <div class="flex flex-1 flex-col p-2.5">
          <h3 class="truncate text-sm font-semibold text-gray-900" [title]="product.name">{{ product.name }}</h3>
        </div>

        <mat-divider></mat-divider>
        
        <mat-card-actions class="!flex !justify-between !gap-1 !px-1 !py-1.5">
          <a mat-button class="!min-w-0 flex-1 !px-0 !text-xs !text-indigo-600" [routerLink]='["/products/detail", product.id]'>Ver</a>
          <a mat-button class="!min-w-0 flex-1 !px-0 !text-xs !text-gray-600" [routerLink]='["/products/edit", product.id]'>Editar</a>
          <button mat-button color="warn" class="!min-w-0 flex-1 !px-0 !text-xs" (click)="deleteProduct(product.id)">Borrar</button>
        </mat-card-actions>
      </mat-card>
    }
  </div>

  <div class="mt-6 flex justify-center">
    <mat-paginator
      class="!rounded-lg !bg-white !shadow-sm !text-xs"
      [length]="totalElements()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[10, 20, 30, 50]"
      [pageIndex]="pageIndex()"
      (page)="changePage($event)"
      aria-label="Seleccionar página">
    </mat-paginator>
  </div>
</div>
