<div class="container">
  <div class="search-wrapper">
    <mat-card class="search-card">
      <input 
        type="text" 
        #txtSearch 
        class="search-input" 
        placeholder="Buscar productos..." 
        (input)="onSearch(txtSearch.value)">
    </mat-card>
  </div>

  <section class="product-grid">
    @for (product of products(); track product.id) {
      <mat-card class="product-card">
        <img mat-card-image [src]="product.imageUrl || 'assets/placeholder.png'" [alt]="product.name" class="card-image" />
        
        <mat-card-header>
          <mat-card-title>{{ product.name }}</mat-card-title>
        </mat-card-header>
        
        <mat-card-content>
        </mat-card-content>

        <mat-divider></mat-divider>
        
        <mat-card-actions >
          <a mat-button color="primary" [routerLink]='["/products/detail", product.id]'>Ver</a>
          <a mat-button color="accent" [routerLink]='["/products/edit", product.id]'>Editar</a>
          <button mat-button color="warn" (click)="deleteProduct(product.id)">Eliminar</button>
        </mat-card-actions>
      </mat-card>
    }
  </section>

  <mat-paginator
      class="paginator"
      [length]="totalElements()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 18, 25]"
      [pageIndex]="pageIndex()"
      (page)="changePage($event)"
      aria-label="Seleccionar página">
  </mat-paginator>
</div>
