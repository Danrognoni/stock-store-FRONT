@if (product(); as p) {
  <div class="container">
    <mat-card>
      <mat-card-header>
        <mat-icon mat-card-avatar>inventory_2</mat-icon>
        <mat-card-title>{{ p.name }}</mat-card-title>
        <mat-card-subtitle>ID: {{ p.id }}</mat-card-subtitle>
      </mat-card-header>

      @if (p.imageUrl) {
        <img mat-card-image [src]="p.imageUrl" [alt]="p.name">
      }

      <mat-card-content>
        <mat-list>

          
          <mat-list-item>
            <mat-icon matListItemIcon>attach_money</mat-icon>
            <div matListItemTitle>Precio</div>
            <div matListItemLine>{{ p.price }}</div>
          </mat-list-item>
        </mat-list>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button (click)="getBack()">Volver a la lista</button>
      </mat-card-actions>
    </mat-card>
  </div>
}
