<div class="container p-4">

  <div class="flex flex-wrap gap-4 items-center justify-between mb-6">

    <mat-form-field appearance="outline" class="w-full md:w-1/3">
      <mat-label>Buscar producto...</mat-label>
      <input matInput
             [(ngModel)]="searchTerm"
             (ngModelChange)="onSearch($event)"
             placeholder="Ej. Coca Cola">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <mat-button-toggle-group #filterGroup="matButtonToggleGroup"
                             value="all"
                             (change)="onFilterChange($event.value)"
                             appearance="legacy">
      <mat-button-toggle value="all">Todo</mat-button-toggle>
      <mat-button-toggle value="low" class="text-red-600">
        <mat-icon class="icon-sm">warning</mat-icon> Bajo Stock
      </mat-button-toggle>
      <mat-button-toggle value="top" class="text-blue-600">
        <mat-icon class="icon-sm">trending_up</mat-icon> Top Stock
      </mat-button-toggle>
    </mat-button-toggle-group>
  </div>

  <div class="mat-elevation-z8 overflow-auto">
    <table mat-table [dataSource]="items()">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>

      <ng-container matColumnDef="product">
        <th mat-header-cell *matHeaderCellDef> Producto </th>
        <td mat-cell *matCellDef="let element"> {{element.product?.name}} </td>
      </ng-container>

      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef> Stock </th>
        <td mat-cell *matCellDef="let element" [class.text-red-600]="element.stock < 15">
          {{element.stock}}
        </td>
      </ng-container>

       <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef> Precio </th>
        <td mat-cell *matCellDef="let element"> ${{element.product?.price}} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let element">
            </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    @if (items().length === 0 && !loading()) {
      <div class="p-4 text-center text-gray-500">
        No se encontraron items.
      </div>
    }
  </div>
</div>
