<div class="container">
  <div class="search-wrapper">
    <mat-card class="search-card">
      <input
        type="text"
        #txtSearch
        class="search-input"
        placeholder="Buscar en inventario..."
        (input)="onSearch(txtSearch.value)">
    </mat-card>
  </div>

  <section class="inventory-grid">
    @for (item of inventoryItems(); track item.id) {
      <mat-card class="inventory-card">
        <img mat-card-image [src]="item.product?.imageUrl || 'assets/placeholder.png'" [alt]="item.product?.name" class="card-image" />

        <mat-card-header>
          <mat-card-title>{{ item.product?.name }}</mat-card-title>
          <mat-card-subtitle>Precio: ${{ item.product?.price }}</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <p><strong>Stock:</strong> {{ item.stock }}</p>
        </mat-card-content>

        <mat-divider></mat-divider>

        <mat-card-actions>
          <a mat-button color="accent" [routerLink]='["/inventory/edit", item.id]'>Editar</a>
          <button mat-button color="warn" (click)="deleteInventoryItem(item.id)">Eliminar</button>
        </mat-card-actions>
      </mat-card>
    }
  </section>

  <mat-paginator
      class="paginator"
      [length]="totalElements()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 18, 25]"
      [pageIndex]="pageIndex()"
      (page)="changePage($event)"
      aria-label="Seleccionar página">
  </mat-paginator>
</div>
