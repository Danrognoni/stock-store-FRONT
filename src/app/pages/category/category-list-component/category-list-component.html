<div class="dashboard-container">
  
  <header class="page-header">
    <div class="header-content">
      <h1 class="page-title">Categorías</h1>
      <span class="page-subtitle">Gestiona el catálogo de productos</span>
    </div>

    <div class="search-wrapper">
      <mat-icon class="search-icon">search</mat-icon>
      <input 
        type="text" 
        #txtSearch 
        (input)="onSearch(txtSearch.value)"
        placeholder="Buscar categoría..."
        class="custom-input"
      >
    </div>
  </header>

  <div class="cards-grid">
    @for (c of categories(); track c.id) {
      <div class="pro-card">
        <div class="card-accent"></div>
        
        <div class="card-body">
          <div class="card-info">
            <h3 class="card-title">{{ c.name }}</h3>
            <span class="card-id">ID: #{{ c.id }}</span>
          </div>
          
          <div class="card-icon">
            {{ c.name.charAt(0)  }}
          </div>
        </div>

        <div class="card-footer">
          <button class="btn-icon edit" [routerLink]='["/products/category/edit", c.id]' title="Editar">
            <mat-icon>edit_note</mat-icon>
          </button>
          <button class="btn-icon delete" (click)="deleteCategory(c.id)" title="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>
    } @empty {
      <div class="empty-state">
        <mat-icon>folder_off</mat-icon>
        <p>No hay resultados para tu búsqueda.</p>
      </div>
    }
  </div>

  <div class="paginator-wrapper">
    <mat-paginator
      [length]="totalElements()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 25, 100]"
      (page)="changePage($event)"
      aria-label="Seleccionar página">
    </mat-paginator>
  </div>

</div>
