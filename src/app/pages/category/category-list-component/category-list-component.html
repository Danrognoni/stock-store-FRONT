<mat-card class="search-container">
  <div>
    <input
      type="text"
      #txtSearch
      placeholder="Buscar categoría por nombre..."
      (input)="onSearch(txtSearch.value)"
    >
    <a mat-raised-button color="primary" routerLink="/categories/createCategory">
      Nueva Categoría
    </a>
  </div>
</mat-card>

<section class="category-grid">
  @for (c of categories(); track c.id) {
    <mat-card class="category-card">
      <mat-card-header>
        <mat-card-title>{{ c.name }}</mat-card-title>
      </mat-card-header>

      <mat-card-actions align="end">
        <a mat-button [routerLink]="['/categories/editCategory', c.id]">Editar</a>
        <button mat-button color="warn" (click)="deleteCategory(c.id)">Eliminar</button>
      </mat-card-actions>
    </mat-card>
  } @empty {
    <p>No se encontraron categorías.</p>
  }
</section>

<mat-paginator
    [length]="totalElements()"
    [pageSize]="pageSize()"
    [pageIndex]="pageIndex()"
    [pageSizeOptions]="[5, 10, 25, 100]"
    (page)="changePage($event)"
    aria-label="Seleccionar página">
</mat-paginator>
