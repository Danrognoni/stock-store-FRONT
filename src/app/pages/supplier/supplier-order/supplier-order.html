<div class="container" style="padding: 20px; max-width: 800px; margin: 0 auto;">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Nueva Orden de Compra</mat-card-title>
      <mat-card-subtitle>Para: {{ supplierName() }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="orderForm" (submit)="onSubmit()">

        <div formArrayName="items">
          @for (item of items.controls; track $index) {
            <div [formGroupName]="$index" class="item-row" style="display: flex; gap: 10px; align-items: baseline; margin-bottom: 10px;">

              <mat-form-field appearance="outline" style="flex: 2;">
                <mat-label>Producto</mat-label>
                <input matInput formControlName="productName" placeholder="Nombre del producto">
                @if (item.get('productName')?.hasError('required')) {
                  <mat-error>Requerido</mat-error>
                }
              </mat-form-field>

              <mat-form-field appearance="outline" style="flex: 1;">
                <mat-label>Cantidad</mat-label>
                <input matInput type="number" formControlName="quantity" min="1">
              </mat-form-field>

              <button mat-icon-button color="warn" type="button" (click)="removeItem($index)" [disabled]="items.length === 1">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          }
        </div>

        <button mat-stroked-button color="primary" type="button" (click)="addItem()">
          <mat-icon>add</mat-icon> Agregar Producto
        </button>

        <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
          <button mat-button type="button" routerLink="/suppliers">Cancelar</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="orderForm.invalid">
            Enviar Orden
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
