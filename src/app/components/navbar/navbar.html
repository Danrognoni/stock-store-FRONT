<mat-toolbar color="primary" class="navbar-header">
  <span>Gestock</span>

  <span class="spacer"></span>

  <div class="nav-links">
    @for (item of navItems(); track item.label) {
      <button mat-button
              [routerLink]="item.link"
              routerLinkActive="active-link">
        <mat-icon>{{ item.icon }}</mat-icon>
        {{ item.label }}
      </button>
    }
  </div>
</mat-toolbar>
