<div class="layout-wrapper min-h-screen flex flex-col justify-between relative overflow-hidden font-sans text-slate-600 dark:text-slate-300">

  <div class="absolute inset-0 -z-10 bg-white dark:bg-[#0B1120]">
    <div class="absolute inset-0 bg-gradient-to-tr from-indigo-50/50 via-white to-blue-50/30 dark:from-slate-900 dark:via-[#0B1120] dark:to-slate-900"></div>
    <div class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20 dark:opacity-5"></div>
    <div class="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-slate-200 dark:via-slate-700 to-transparent opacity-50"></div>
  </div>

  <header class="sticky top-0 z-50 backdrop-blur-md bg-white/70 dark:bg-[#0B1120]/80 border-b border-slate-200/60 dark:border-slate-800/60 support-backdrop-blur">
    <div class="container mx-auto">
      <app-navbar-component [items]="menu"></app-navbar-component>
    </div>
  </header>

  <main class="flex-1 w-full relative z-0 flex flex-col">
    <router-outlet></router-outlet>
  </main>

  <footer class="mt-auto py-6 border-t border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-[#0f172a]/50 backdrop-blur-sm">
    <div class="container mx-auto px-4 md:px-8 flex flex-col md:flex-row justify-between items-center text-xs md:text-sm text-slate-500 dark:text-slate-400">
      <div class="mb-2 md:mb-0">
        <span class="font-semibold text-slate-700 dark:text-slate-200">StockStore</span> &copy; 2026. Todos los derechos reservados.
      </div>
      <div class="flex space-x-6">
        <a href="#" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">Soporte</a>
        <a href="#" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">Privacidad</a>
        <a href="#" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">Términos</a>
      </div>
    </div>
  </footer>

</div>
