<div class="layout-wrapper min-h-screen flex flex-col justify-between relative overflow-hidden font-sans text-slate-600">

  <div class="absolute inset-0 -z-10 bg-white">
    <div class="absolute inset-0 bg-gradient-to-tr from-indigo-50/50 via-white to-blue-50/30"></div>
    <div class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20"></div>
    <div class="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-slate-200 to-transparent opacity-50"></div>
  </div>

  <header class="sticky top-0 z-50 backdrop-blur-md bg-white/70 border-b border-slate-200/60 support-backdrop-blur">
    <div class="container mx-auto">
      <app-navbar-component [items]="menu"></app-navbar-component>
    </div>
  </header>

  <main class="flex-1 w-full relative z-0 flex flex-col">
    <router-outlet></router-outlet>
  </main>

</div>
