<mat-toolbar color="primary" class="navbar">

<span [routerLink]="authService.currentUser() ? '/home' : []"
      [style.cursor]="authService.currentUser() ? 'pointer' : 'default'"
      style="font-weight: bold; margin-right: 20px;">
      Stock Store
</span>

  @for (item of items(); track item) {
    @if (!item.roles || item.roles.includes(authService.currentUser()?.role)) {
      <button mat-button [routerLink]="item.route" routerLinkActive="active-link">
        {{ item.label }}
      </button>
    }
  }

  <span class="spacer"></span>

  @if (authService.currentUser(); as user) {

    <button mat-button [matMenuTriggerFor]="userMenu">
      <mat-icon>person</mat-icon>
      Hola, {{ user.name }}
      <mat-icon>arrow_drop_down</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu">
      <button mat-menu-item routerLink="/user-detail">
        <mat-icon>account_circle</mat-icon>
        <span>Mi Perfil</span>
      </button>

      @if (user.role === 'ADMIN') {
        <button mat-menu-item routerLink="/admin">
          <mat-icon>settings</mat-icon>
          <span>Administración</span>
        </button>
      }

      <button mat-menu-item (click)="logout()">
        <mat-icon>exit_to_app</mat-icon>
        <span>Cerrar Sesión</span>
      </button>
    </mat-menu>

  } @else {

    <button mat-button routerLink="/auth/login">Iniciar Sesión</button>
    <button mat-raised-button color="accent" routerLink="/auth/register" style="margin-left: 10px;">
      Registrarse
    </button>
  }

</mat-toolbar>
